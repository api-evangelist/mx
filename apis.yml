aid: mx
url: https://raw.githubusercontent.com/api-evangelist/mx/refs/heads/main/apis.yml
name: MX
kind: company
description: MX Technologies is a privately held financial data platform headquartered
  in Lehi, Utah, operating as a B2B data aggregator and open-finance infrastructure
  provider rather than a chartered bank or credit union. MX connects consumer and
  business accounts across tens of thousands of financial institutions and fintechs,
  then cleanses, categorizes, and enhances the resulting transaction data so banks
  and fintechs can build verification, aggregation, and personal-finance experiences.
  Unlike most US banks, MX runs a real, self-documented developer surface — the MX
  Platform API (HTTP Basic auth over https://api.mx.com), a Consent Management API,
  and a Data Access product that shares and consumes institution data using FDX and
  OAuth standards — with downloadable OpenAPI 3.0 specifications published at
  docs.mx.com. MX is one of the major US open-finance aggregators (alongside Plaid,
  Finicity, and Akoya) and positions Data Access as FDX-conformant, consumer-permissioned,
  tokenized data sharing.
