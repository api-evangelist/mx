- aid: mx:mx-investment-holdings-api
  name: MX investment holdings API
  description: >-
    Investment Data Enhancement lets you connect to an end user's financial institution and retrieve cleansed
    and enhanced investment data. By combining investment data with retail banking information, you get
    comprehensive insights into customer financial behaviors, risk tolerance, and investment strategies.


    You can [read a user's holding](docs.mx.com/api-reference/platform-api/reference/read-holding), [list
    all their holdings](docs.mx.com/api-reference/platform-api/reference/list-holdings), or list their
    holdings by [account](docs.mx.com/api-reference/platform-api/reference/list-holdings-by-account) or
    [member](docs.mx.com/api-reference/platform-api/reference/list-holdings-by-member).


    You can also [deactivate a user](docs.mx.com/api-reference/platform-api/reference/deactivate-user)
    from the Investment Data Enhancement. This is non-billable.
