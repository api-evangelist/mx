- aid: mx:mx-accounts-api
  name: MX Accounts API
  description: >-
    The Accounts endpoints represent a user's checking, savings, mortgage, 401(k), or other types of accounts
    held by a financial institution.


    An account belongs to a `member`, which represents the user's overall relationship with a particular
    financial institution. A checking account may be just one part of a larger relationship that could
    also include a car loan and a savings account.


    Accounts—and the transactions associated with them—are updated every 24 hours, unless the associated
    `user` is disabled.


    You can also create manual accounts. Since a manual account has no credentials tied to the member,
    the account will never aggregate or include data from a data feed. All manual accounts are automatically
    created under the Manual Institution member.
  humanURL: https://docs.mx.com/api-reference/platform-api/reference/mx-platform-api
  baseURL: https://api.mx.com
